[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synctake"
version = "0.2.0"
description = "SyncTake: Agent-First Walkthrough-as-Code — Automated, perfectly synchronized product walkthrough videos with zero audio drift."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "SyncTake Contributors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
    "pyloudnorm>=0.1.0",
    "librosa>=0.10.0",
    "imageio-ffmpeg>=0.4.8",
]

[project.optional-dependencies]
mlx = [
    "mlx>=0.10.0",
    "mlx-audio>=0.6.0",
]
playwright = [
    "playwright>=1.40.0",
]

[project.scripts]
synctake = "synctake.cli:main"

[tool.setuptools.packages.find]
include = ["synctake*"]

[tool.setuptools.package-data]
synctake = ["client/*"]
