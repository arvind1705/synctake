[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synctake"
version = "0.1.0"
description = "SyncTake: Walkthrough-as-Code — Automated, perfectly synchronized product walkthrough videos with zero-shot voice cloning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SyncTake Contributors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
    "pyloudnorm>=0.1.0",
    "librosa>=0.10.0",
    "imageio-ffmpeg>=0.4.8",
]

[project.optional-dependencies]
mlx = [
    "mlx>=0.10.0",
    "mlx-audio>=0.6.0",
]

[project.scripts]
synctake = "synctake.cli:main"
